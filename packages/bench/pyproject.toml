[project]
name = "mlx-omnia-bench"
version = "0.1.0"
description = "Thermally gated, teacher-forced A/B benchmarking for MLX on Apple Silicon"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
mlx = ["mlx==0.32.*"]
omnia = ["mlx-omnia", "huggingface-hub>=0.30"]
mlx-lm = ["mlx-lm", "huggingface-hub>=0.30"]

[project.scripts]
omnia-bench = "mlx_omnia_bench.cli:main"

[tool.uv.sources]
mlx-omnia = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
