[project]
name = "sideros-server"
version = "0.1.0"
description = "HTTP API for the sideros inference engine"
requires-python = ">=3.13"
dependencies = [
    "sideros",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "huggingface_hub>=0.30",
    "pyarrow>=17",
    "watchdog>=4",
]

[project.scripts]
sideros-server = "sideros_server.main:main"

[tool.uv.sources]
sideros = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
