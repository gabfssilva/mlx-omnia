[project]
name = "mlx-omnia-server"
version = "0.1.0"
description = "HTTP API for the mlx-omnia inference engine"
requires-python = ">=3.13"
dependencies = [
    "mlx-omnia",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "huggingface_hub>=0.30",
    "pyarrow>=17",
    "watchdog>=4",
]

[project.scripts]
omnia-server = "mlx_omnia_server.main:main"

[tool.uv.sources]
mlx-omnia = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
