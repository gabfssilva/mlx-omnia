[project]
name = "sideros-app"
version = "0.1.0"
description = "Chat app for the sideros server (Flet, web + desktop)"
requires-python = ">=3.13"
dependencies = [
    "flet[all]>=0.28",
    "httpx>=0.27",
]

[project.scripts]
sideros-app = "sideros_app.main:run"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.flet.app]
path = "src"
