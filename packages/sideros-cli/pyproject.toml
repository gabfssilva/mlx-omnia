[project]
name = "sideros-cli"
version = "0.1.0"
description = "Command line client for the sideros daemon (HTTP only)"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
sideros = "sideros_cli.main:run"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
