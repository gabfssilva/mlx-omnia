[project]
name = "mlx-omnia"
version = "0.1.0"
description = "Inference engine for Apple Silicon on MLX"
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub>=0.30",
    "jinja2>=3.1.6",
    "llguidance>=1.7",
    "mlx==0.32.*",
    "numpy>=2",
    "regex>=2026.7.10",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
