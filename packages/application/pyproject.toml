[project]
name = "sideros-application"
version = "0.1.0"
description = "Desktop window for the sideros daemon (HTTP only)"
requires-python = ">=3.13"
dependencies = [
    "flet[desktop]>=0.86",
    "httpx>=0.28",
]

[project.scripts]
sideros-app = "sideros_application.main:run"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

# Ruff resolves the config nearest the file, so the window keeps its own rules: BLE, and
# the typeset characters the stylesheet's copy uses (×, −, ∪, the en dash) left alone.
[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
