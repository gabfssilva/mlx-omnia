[tools]
uv = "0.11"
node = "26"

[env]
_.python.venv = { path = ".venv", create = false }

# Sparkle is fetched at build time rather than vendored — 15 MB of binary that nothing in
# the tree reads. The tarball ships ad-hoc signed and is re-signed with our own identity on
# the way into the .app, so the pin and its checksum are the only provenance left.
SPARKLE_VERSION = "2.9.5"
SPARKLE_SHA256 = "015336b601493e05c237964954bff6191370003d94edefe663724c88840d73cc"

[tasks.sync]
description = "install the dev environment (the extras are not installed by a bare sync)"
run = "uv sync --extra all --extra mlx-lm"

[tasks.test]
description = "pytest (pass paths/-k to narrow; the full suite is slow)"
run = "uv run pytest -q"

[tasks.lint]
description = "ruff check"
run = "uv run ruff check"

[tasks.types]
description = "pyright"
run = "uv run pyright"

[tasks.imports]
description = "import-linter contracts"
run = "uv run lint-imports"

[tasks.gate]
description = "full gate: pytest + ruff + pyright + lint-imports (sequential)"
run = """
uv run pytest -q
uv run ruff check
uv run pyright
uv run lint-imports
"""

[tasks."bench:interleaved"]
description = "interleaved bench vs mlx-lm git main (args: <model> [--draft <name>])"
run = """
uv run --with "mlx-lm @ git+https://github.com/ml-explore/mlx-lm" \
    omnia-bench interleaved --against mlx-lm
"""

[tasks."bench:paired"]
description = "paired bench: working tree vs a git ref (args: <model> [--ref <ref>])"
run = "uv run omnia-bench paired"

[tasks."bench:constrained"]
description = "constrained-decoding bench (args: <model>)"
run = "uv run python scripts/constrained.py"

[tasks."bench:grammar"]
description = "grammar bench (args: <model>)"
run = """
uv run --no-project --with xgrammar --with llguidance --with transformers \
    python scripts/grammar.py
"""

[tasks.server]
description = "run the FastAPI server"
run = "uv run omnia-server"

[tasks.app]
description = "run the Flet window (it starts the engine when nothing answers on 8642)"
run = "uv run omnia-app"

[tasks.appv2]
description = "run the Quieta mockup window (no daemon behind it yet)"
run = "uv run omnia-appv2"

[tasks.menubar]
description = "run the menu bar panel (puts an icon in the bar; the panel hangs off it)"
run = "uv run omnia-menubar"

[tasks.panel]
description = "build and run the SwiftUI panel in app/ (MenuBarExtra; replaces the Flet one)"
run = """
set -eu
pkill -f 'MLX Omnia.app/Contents/MacOS/OmniaPanel' 2>/dev/null || true
bundle="$(app/build.sh release | tail -1)"
open "app/$bundle"
echo "app/$bundle"
"""

[tasks."panel:build"]
description = "build app/ into an .app without launching it"
run = "app/build.sh release"

[tasks.cli]
description = "run the HTTP-only CLI"
run = "uv run omnia"

[tasks."sparkle:fetch"]
description = "unpack the pinned Sparkle into build/sparkle"
run = """
set -eu
if [ -d build/sparkle/Sparkle.framework ]; then exit 0; fi
mkdir -p build/sparkle build/cache
tarball="build/cache/Sparkle-$SPARKLE_VERSION.tar.xz"
if [ ! -f "$tarball" ]; then
    curl -fsSL -o "$tarball" \\
        "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
fi
echo "$SPARKLE_SHA256  $tarball" | shasum -a 256 -c -
tar xf "$tarball" -C build/sparkle
"""

[tasks."sparkle:keys"]
description = "the EdDSA pair Sparkle verifies with — private into the Keychain, public to stdout"
depends = ["sparkle:fetch"]
run = "build/sparkle/bin/generate_keys"

[tasks."dmg:app"]
description = "build the window bundle (flet build macos) into build/macos"
run = """
set -eu
# Sparkle compares CFBundleVersion, and flet's default for it is the literal 1 — every
# build would look like the same version and no update would ever be offered. The tag is
# what the app shows; the commit count is the number that has to keep going up, and it
# does so before the first tag exists.
version=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
uvx --from flet-cli==0.86.5 flet build macos --yes --python-version 3.13 \\
    --build-version "${version#v}" --build-number "$(git rev-list --count HEAD)"
"""

[tasks."dmg:engine"]
description = "lay a CPython with the engine in it beside the window, inside the .app"
depends = ["dmg:app"]
run = """
set -eu
app=build/macos/mlx-omnia.app
resources="$app/Contents/Resources"
rm -rf build/engine "$resources/engine"
uv python install --install-dir build/engine 3.13
# uv leaves a `cpython-3.13-…` symlink beside the versioned directory, and it points at a
# path relative to the repo root — following it after the move would dangle. The dot after
# the minor version is what selects the real one.
runtime=$(ls -d build/engine/cpython-3.13.*-macos-*/ | head -1)
runtime=${runtime%/}
# `--break-system-packages` is not a workaround here: uv marks its managed interpreters
# externally managed, and installing into one is exactly the intent. The tree is
# self-contained and relocatable — nothing absolute is written into it.
uv pip install --break-system-packages --python "$runtime/bin/python3" ".[server]"
mv "$runtime" "$resources/engine"
rm -rf build/engine
# The console scripts hold the path they were installed under and break on the move into
# /Applications. The window invokes `-m`, so they are dead weight either way.
rm -rf "$resources/engine/bin/omnia-server" "$resources/engine/bin/omnia" \\
       "$resources/engine/bin/omnia-bench" "$resources/engine/bin/omnia-app"

# `flet build` installs `project.dependencies` into the window's own site-packages and
# offers no way to say otherwise, so the engine's wheels land there too — mlx, pyarrow and
# the hub client, inside a process that speaks HTTP and nothing else. What stays is derived
# rather than listed: the resolved closure of what the window declares. A denylist would go
# stale the day the engine takes a new dependency, and the mistake would be silent.
window="$resources/serious_python_darwin_serious_python_darwin.bundle/Contents/Resources/site-packages"
uv pip compile --quiet --python-version 3.13 --output-file build/window-closure.txt - <<'DEPS'
flet[desktop]>=0.86
httpx>=0.28
DEPS
uv run python scripts/prune_window.py "$window" build/window-closure.txt
du -sh "$app"
"""

[tasks."dmg:sparkle"]
description = "lay Sparkle.framework into the .app, so the window has an updater to load"
depends = ["dmg:engine", "sparkle:fetch"]
run = """
set -eu
frameworks=build/macos/mlx-omnia.app/Contents/Frameworks
rm -rf "$frameworks/Sparkle.framework"
# ditto and not cp -R: a versioned framework is symlinks into Versions/Current, and a copy
# that resolves them is a directory tree that no longer signs as one bundle.
ditto build/sparkle/Sparkle.framework "$frameworks/Sparkle.framework"
"""

[tasks.dmg]
description = "the shippable disk image (unsigned unless CODESIGN_IDENTITY is set)"
depends = ["dmg:sparkle"]
run = """
set -eu
app=build/macos/mlx-omnia.app
sparkle="$app/Contents/Frameworks/Sparkle.framework"
if [ -n "${CODESIGN_IDENTITY:-}" ]; then
    sign() {
        codesign --force --timestamp --options runtime --sign "$CODESIGN_IDENTITY" "$@"
    }
    # Inside out: every nested binary before the bundle that contains it, or the outer
    # signature is invalidated by the ones sealed after it. Sparkle is pruned out of the
    # sweep and taken separately below — its XPC services and Updater.app are bundles, and
    # signing the Mach-O inside a bundle instead of the bundle leaves its Info.plist
    # unsealed, which is the state notarization rejects.
    find "$app" -name Sparkle.framework -prune -o -type f \\
        \\( -name "*.dylib" -o -name "*.so" -o -perm -u+x \\) \\
        -exec codesign --force --timestamp --options runtime \\
        --sign "$CODESIGN_IDENTITY" {} + || true
    # Read off Versions/Current rather than spelled B, so a Sparkle bump that moves the
    # letter fails here instead of signing nothing and shipping the ad-hoc signature.
    current=$(readlink "$sparkle/Versions/Current")
    for nested in XPCServices/Downloader.xpc XPCServices/Installer.xpc Updater.app Autoupdate; do
        sign "$sparkle/Versions/$current/$nested"
    done
    sign "$sparkle/Versions/$current"
    # No --deep on the app: it re-signs everything below with these entitlements, which is
    # wrong for Sparkle's helpers and throws away the signatures placed just above.
    codesign --force --timestamp --options runtime \\
        --entitlements build/flutter/macos/Runner/Release.entitlements \\
        --sign "$CODESIGN_IDENTITY" "$app"
    codesign --verify --deep --strict --verbose=2 "$app"
else
    echo "CODESIGN_IDENTITY unset — the image is unsigned and Gatekeeper will quarantine it."
fi
rm -f build/Omnia.dmg
hdiutil create -volname Omnia -srcfolder "$app" -ov -format UDZO build/Omnia.dmg
ls -lh build/Omnia.dmg
"""

[tasks."pypi:build"]
description = "build the publishable sdist + wheel into dist/"
run = """
rm -rf dist
uv build --out-dir dist
"""

[tasks."pypi:check"]
description = "validate dist/ the way PyPI will (long_description, metadata)"
depends = ["pypi:build"]
run = "uvx twine check dist/*"
