[tools]
uv = "0.11"
node = "26"

[env]
_.python.venv = { path = ".venv", create = false }

[tasks.test]
description = "pytest (pass paths/-k to narrow; the full suite is slow)"
run = "uv run pytest -q"

[tasks.lint]
description = "ruff check"
run = "uv run ruff check"

[tasks.types]
description = "pyright"
run = "uv run pyright"

[tasks.imports]
description = "import-linter contracts"
run = "uv run lint-imports"

[tasks.gate]
description = "full gate: pytest + ruff + pyright + lint-imports (sequential)"
run = """
uv run pytest -q
uv run ruff check
uv run pyright
uv run lint-imports
"""

[tasks."bench:interleaved"]
description = "interleaved bench vs mlx-lm git main (args: <model> [--draft <name>])"
run = """
uv run --with "mlx-lm @ git+https://github.com/ml-explore/mlx-lm" \
    omnia-bench interleaved --against mlx-lm
"""

[tasks."bench:paired"]
description = "paired bench: working tree vs a git ref (args: <model> [--ref <ref>])"
run = "uv run omnia-bench paired"

[tasks."bench:constrained"]
description = "constrained-decoding bench (args: <model>)"
run = "uv run python packages/bench/scripts/constrained.py"

[tasks."bench:grammar"]
description = "grammar bench (args: <model>)"
run = """
uv run --no-project --with xgrammar --with llguidance --with transformers \
    python packages/bench/scripts/grammar.py
"""

[tasks.server]
description = "run the FastAPI server"
run = "uv run omnia-server"

[tasks.app]
description = "run the Flet window (it starts the engine when nothing answers on 8642)"
run = "uv run omnia-app"

[tasks.cli]
description = "run the HTTP-only CLI"
run = "uv run omnia"
