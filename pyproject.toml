[project]
name = "sideros-workspace"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = ["sideros", "sideros-server", "sideros-cli", "sideros-application"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.12",
    "pyright>=1.1",
    "transformers>=5.14.1",
    "openai>=1.60",
    "numpy>=2",
    "safetensors>=0.4",
    "huggingface-hub>=0.30",
    "anthropic>=0.40",
    "google-genai>=1.0",
    "import-linter>=2.13",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
sideros = { workspace = true }
sideros-server = { workspace = true }
sideros-cli = { workspace = true }
sideros-application = { workspace = true }

[tool.ruff]
line-length = 100
src = ["packages/engine/src", "packages/server/src", "packages/cli/src"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # bugbear
    "SIM",       # simplify
    "RUF",
]

[tool.importlinter]
root_packages = ["sideros", "sideros_application"]

[[tool.importlinter.contracts]]
name = "core and bpe never reach up"
type = "forbidden"
source_modules = ["sideros.core", "sideros.bpe", "sideros.parsers", "sideros.quant"]
forbidden_modules = ["sideros.models"]

[[tool.importlinter.contracts]]
name = "model families are independent, except tokenizers"
type = "independence"
modules = ["sideros.models.*"]
ignore_imports = ["sideros.models.** -> sideros.models.*.tokenizer"]

[[tool.importlinter.contracts]]
name = "models never name a dialect"
type = "forbidden"
source_modules = ["sideros.models"]
forbidden_modules = [
    "sideros.parsers.qwen",
    "sideros.parsers.qwen_xml",
    "sideros.parsers.harmony",
    "sideros.parsers.atem",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "the window stacks one way"
type = "layers"
layers = [
    "sideros_application.main",
    "sideros_application.views",
    "sideros_application.ui",
    "sideros_application.api",
]

[[tool.importlinter.contracts]]
name = "screens do not know each other"
type = "independence"
modules = ["sideros_application.views.*"]

[tool.pyright]
typeCheckingMode = "off"
#typeCheckingMode = "strict"
# mlx ships incomplete stubs (mlx.nn has none; array methods take Unknown varargs).
# Our signatures stay fully annotated; these rules only flag mlx's gap.
reportMissingTypeStubs = false
reportUnknownMemberType = false
pythonVersion = "3.13"
include = ["packages"]
exclude = ["**/__pycache__", ".venv", ".legacy", "**/tests/fixtures", "**/build"]
venvPath = "."
venv = ".venv"

[[tool.pyright.executionEnvironments]]
root = "examples"
reportUnknownVariableType = false

# huggingface_hub expõe Unknown nos overloads de download (tqdm genérico).
[[tool.pyright.executionEnvironments]]
root = "packages/server/src"
reportUnknownVariableType = false

# transformers/huggingface_hub (dev-deps de fixture) expõem Unknown; só nos testes.
[[tool.pyright.executionEnvironments]]
root = "packages/server/tests"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportPrivateUsage = false

[[tool.pyright.executionEnvironments]]
root = "packages/engine/tests"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportPrivateUsage = false

[tool.pytest.ini_options]
testpaths = ["packages/engine/tests", "packages/server/tests", "packages/cli/tests"]
