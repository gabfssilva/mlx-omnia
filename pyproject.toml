[project]
name = "mlx-omnia"
dynamic = ["version"]
description = "Inference engine for Apple Silicon on MLX"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Francisco", email = "gabfssilva@gmail.com" }]
requires-python = ">=3.13"
keywords = ["mlx", "llm", "inference", "apple-silicon", "metal", "quantization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "huggingface-hub>=0.30",
    "jinja2>=3.1.6",
    "llguidance>=1.7",
    "mlx==0.32.*",
    "numpy>=2",
    "regex>=2026.7.10",
]

# One distribution, five things inside it. Every subpackage ships; what is optional is what
# it needs to run, so `pip install mlx-omnia` stays the engine's own dependency set and
# nothing more. Importing `mlx_omnia.server` without its extra fails on the missing import,
# which is the honest error.
[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30", "pyarrow>=17", "watchdog>=4"]
cli = ["httpx>=0.27"]
app = ["flet[desktop]>=0.86", "httpx>=0.28"]
# The harness runs an arm; `mlx-lm` is the one arm that is not this engine.
mlx-lm = ["mlx-lm"]
all = ["mlx-omnia[server,cli,app]"]

[project.scripts]
omnia-server = "mlx_omnia.server.main:main"
omnia = "mlx_omnia.cli.main:run"
omnia-bench = "mlx_omnia.bench.cli:main"
omnia-app = "mlx_omnia.app.main:run"
omnia-appv2 = "mlx_omnia.appv2.main:run"

[project.urls]
Homepage = "https://github.com/gabfssilva/mlx-omnia"
Source = "https://github.com/gabfssilva/mlx-omnia"
Issues = "https://github.com/gabfssilva/mlx-omnia/issues"

# The tag is the version. `hatch-vcs` reads it off `git describe`, so nothing here says
# 0.2.0 and no commit exists whose only content is bumping a number.
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/mlx_omnia"]

[tool.hatch.build.targets.sdist]
include = ["src/mlx_omnia", "tests", "README.md", "LICENSE"]

# The .app. `flet build` packages `src/` as the app payload, so the engine, the server and
# the window travel as source and only third-party wheels are resolved — which is why the
# list below is the `server` and `app` extras and not `mlx-omnia` itself. `project.
# dependencies` is read on top of it, so the engine's own requirements are not repeated.
[tool.flet]
org = "io.github.gabfssilva"
company = "gabfssilva"
product = "Omnia"
bundle_id = "io.github.gabfssilva.mlx_omnia"
copyright = "Copyright (c) 2026 Gabriel Francisco — MIT"

[tool.flet.app]
path = "src"
module = "main"

[tool.flet.macos]
# arm64 only: the framework flet embeds is universal, and `mlx` publishes no x86_64 wheel
# for macOS, so an Intel slice could never run the engine it is bundled beside.
target_arch = ["arm64"]
# The window's own dependencies, and only those — it speaks HTTP to the daemon and the
# server stack belongs to the interpreter that runs it, not to this one.
dependencies = ["flet[desktop]>=0.86", "httpx>=0.28"]

[tool.flet.macos.entitlement]
# The engine's extension modules are signed by us but loaded into a hardened runtime;
# without this, dyld refuses them and the window comes up with no engine behind it.
"com.apple.security.cs.disable-library-validation" = true

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.12",
    "pyright>=1.1",
    "transformers>=5.14.1",
    "openai>=1.60",
    "numpy>=2",
    "safetensors>=0.4",
    "huggingface-hub>=0.30",
    "anthropic>=0.40",
    "google-genai>=1.0",
    "import-linter>=2.13",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # bugbear
    "SIM",       # simplify
    "RUF",
]

[tool.importlinter]
root_packages = ["mlx_omnia"]

# The engine is a sibling, not the roof, so the boundary is one name and covers whatever
# the engine grows next. `mlx_omnia.bench.arms` is deliberately not a source module — an
# adapter's whole job is to know one engine.
[[tool.importlinter.contracts]]
name = "the harness knows no engine"
type = "forbidden"
source_modules = [
    "mlx_omnia.bench.arm",
    "mlx_omnia.bench.battery",
    "mlx_omnia.bench.ceiling",
    "mlx_omnia.bench.forcing",
    "mlx_omnia.bench.gate",
    "mlx_omnia.bench.paired",
    "mlx_omnia.bench.prompt",
    "mlx_omnia.bench.report",
    "mlx_omnia.bench.sample",
    "mlx_omnia.bench.worker",
]
forbidden_modules = ["mlx_omnia.engine"]

[[tool.importlinter.contracts]]
name = "adapters do not know each other"
type = "independence"
modules = ["mlx_omnia.bench.arms.omnia", "mlx_omnia.bench.arms.mlx_lm"]

# The window and the CLI speak HTTP and nothing else. This was a rule with no contract
# behind it until an .app shipped whose window loaded MLX to draw itself: the re-export in
# `mlx_omnia/__init__` made every import under the roof an engine import, and nothing said
# so. `allow_indirect_imports` is off on purpose — reaching the engine through the roof is
# exactly the path that failed.
[[tool.importlinter.contracts]]
name = "the window and the CLI know no engine"
type = "forbidden"
source_modules = ["mlx_omnia.app", "mlx_omnia.cli"]
forbidden_modules = ["mlx_omnia.engine"]

[[tool.importlinter.contracts]]
name = "core and bpe never reach up"
type = "forbidden"
source_modules = ["mlx_omnia.engine.core", "mlx_omnia.engine.bpe", "mlx_omnia.engine.parsers", "mlx_omnia.engine.quant"]
forbidden_modules = ["mlx_omnia.engine.models"]

[[tool.importlinter.contracts]]
name = "model families are independent, except tokenizers"
type = "independence"
modules = ["mlx_omnia.engine.models.*"]
ignore_imports = ["mlx_omnia.engine.models.** -> mlx_omnia.engine.models.*.tokenizer"]

[[tool.importlinter.contracts]]
name = "models never name a dialect"
type = "forbidden"
source_modules = ["mlx_omnia.engine.models"]
forbidden_modules = [
    "mlx_omnia.engine.parsers.qwen",
    "mlx_omnia.engine.parsers.qwen_xml",
    "mlx_omnia.engine.parsers.harmony",
    "mlx_omnia.engine.parsers.atem",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "the window stacks one way"
type = "layers"
layers = [
    "mlx_omnia.app.main",
    "mlx_omnia.app.views",
    "mlx_omnia.app.ui",
    "mlx_omnia.app.api",
]

[[tool.importlinter.contracts]]
name = "screens do not know each other"
type = "independence"
modules = ["mlx_omnia.app.views.*"]

[tool.pyright]
typeCheckingMode = "off"
#typeCheckingMode = "strict"
# mlx ships incomplete stubs (mlx.nn has none; array methods take Unknown varargs).
# Our signatures stay fully annotated; these rules only flag mlx's gap.
reportMissingTypeStubs = false
reportUnknownMemberType = false
pythonVersion = "3.13"
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv", ".legacy", "**/tests/fixtures", "**/build"]
venvPath = "."
venv = ".venv"

[[tool.pyright.executionEnvironments]]
root = "examples"
reportUnknownVariableType = false

# huggingface_hub expõe Unknown nos overloads de download (tqdm genérico).
[[tool.pyright.executionEnvironments]]
root = "src/mlx_omnia/server"
reportUnknownVariableType = false

# transformers/huggingface_hub (dev-deps de fixture) expõem Unknown; só nos testes.
[[tool.pyright.executionEnvironments]]
root = "tests/server"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportPrivateUsage = false

[[tool.pyright.executionEnvironments]]
root = "tests"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportPrivateUsage = false

[tool.pytest.ini_options]
testpaths = ["tests"]
