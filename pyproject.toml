[project]
name = "mlx-omnia"
dynamic = ["version"]
description = "Inference engine for Apple Silicon on MLX"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Francisco", email = "gabfssilva@gmail.com" }]
requires-python = ">=3.13"
keywords = ["mlx", "llm", "inference", "apple-silicon", "metal", "quantization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "huggingface-hub>=0.30",
    "jinja2>=3.1.6",
    "llguidance>=1.7",
    "mlx==0.32.*",
    "numpy>=2",
    "regex>=2026.7.10",
]

# One distribution, four things inside it. Every subpackage ships; what is optional is what
# it needs to run, so `pip install mlx-omnia` stays the engine's own dependency set and
# nothing more. Importing `mlx_omnia.server` without its extra fails on the missing import,
# which is the honest error. The app is not among them: it is `app/`, a Swift bundle that
# reaches this distribution over HTTP and takes nothing from it at import time.
[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30", "pyarrow>=17", "watchdog>=4"]
cli = ["httpx>=0.27"]
# The harness runs an arm; `mlx-lm` is the one arm that is not this engine.
mlx-lm = ["mlx-lm"]
all = ["mlx-omnia[server,cli]"]

[project.scripts]
omnia-server = "mlx_omnia.server.main:main"
omnia = "mlx_omnia.cli.main:run"
omnia-bench = "mlx_omnia.bench.cli:main"

[project.urls]
Homepage = "https://github.com/gabfssilva/mlx-omnia"
Source = "https://github.com/gabfssilva/mlx-omnia"
Issues = "https://github.com/gabfssilva/mlx-omnia/issues"

# The tag is the version. `hatch-vcs` reads it off `git describe`, so nothing here says
# 0.2.0 and no commit exists whose only content is bumping a number.
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/mlx_omnia"]

[tool.hatch.build.targets.sdist]
include = ["src/mlx_omnia", "tests", "README.md", "LICENSE"]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.12",
    "pyright>=1.1",
    "transformers>=5.14.1",
    "openai>=1.60",
    "numpy>=2",
    "safetensors>=0.4",
    "huggingface-hub>=0.30",
    "anthropic>=0.40",
    "google-genai>=1.0",
    "import-linter>=2.13",
    "pytest-describe>=3.2.0",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # bugbear
    "SIM",       # simplify
    "RUF",
]

[tool.importlinter]
root_packages = ["mlx_omnia"]

# The engine is a sibling, not the roof, so the boundary is one name and covers whatever
# the engine grows next. `mlx_omnia.bench.arms` is deliberately not a source module — an
# adapter's whole job is to know one engine.
[[tool.importlinter.contracts]]
name = "the harness knows no engine"
type = "forbidden"
source_modules = [
    "mlx_omnia.bench.arm",
    "mlx_omnia.bench.battery",
    "mlx_omnia.bench.ceiling",
    "mlx_omnia.bench.forcing",
    "mlx_omnia.bench.gate",
    "mlx_omnia.bench.paired",
    "mlx_omnia.bench.prompt",
    "mlx_omnia.bench.report",
    "mlx_omnia.bench.sample",
    "mlx_omnia.bench.worker",
]
forbidden_modules = ["mlx_omnia.engine"]

[[tool.importlinter.contracts]]
name = "adapters do not know each other"
type = "independence"
modules = ["mlx_omnia.bench.arms.omnia", "mlx_omnia.bench.arms.mlx_lm"]

# The CLI speaks HTTP and nothing else. This was a rule with no contract behind it until an
# .app shipped whose window loaded MLX to draw itself: the re-export in `mlx_omnia/__init__`
# made every import under the roof an engine import, and nothing said so. The window that
# failed that way is gone — the app is Swift now — and the client that still ships beside
# the engine is this one. `allow_indirect_imports` is off on purpose: reaching the engine
# through the roof is exactly the path that failed.
[[tool.importlinter.contracts]]
name = "the CLI knows no engine"
type = "forbidden"
source_modules = ["mlx_omnia.cli"]
forbidden_modules = ["mlx_omnia.engine"]

[[tool.importlinter.contracts]]
name = "core and bpe never reach up"
type = "forbidden"
source_modules = ["mlx_omnia.engine.core", "mlx_omnia.engine.bpe", "mlx_omnia.engine.parsers", "mlx_omnia.engine.quant"]
forbidden_modules = ["mlx_omnia.engine.models"]

[[tool.importlinter.contracts]]
name = "model families are independent, except tokenizers"
type = "independence"
modules = ["mlx_omnia.engine.models.*"]
ignore_imports = ["mlx_omnia.engine.models.** -> mlx_omnia.engine.models.*.tokenizer"]

[[tool.importlinter.contracts]]
name = "models never name a dialect"
type = "forbidden"
source_modules = ["mlx_omnia.engine.models"]
forbidden_modules = [
    "mlx_omnia.engine.parsers.qwen",
    "mlx_omnia.engine.parsers.qwen_xml",
    "mlx_omnia.engine.parsers.harmony",
    "mlx_omnia.engine.parsers.atem",
]
allow_indirect_imports = true

[tool.pyright]
typeCheckingMode = "strict"
# mlx ships incomplete stubs (mlx.nn has none; array methods take Unknown varargs).
# Our signatures stay fully annotated; these rules only flag mlx's gap.
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
# pytest-describe collects nested functions by name; strict counts every one as unused.
reportUnusedFunction = false
pythonVersion = "3.13"
include = ["src", "tests"]
exclude = [
    "**/__pycache__",
    ".venv",
    ".legacy",
    "**/tests/fixtures",
    "**/build",
    # The one module here that runs outside this environment: xgrammar and llguidance are
    # not dependencies of anything, they are what it compares, and `uv run --no-project
    # --with` is where it has them. Checked here, every handle it holds is `object` and
    # every import is unresolved — twenty errors that say nothing about the file.
    "src/mlx_omnia/bench/grammar.py",
]
venvPath = "."
venv = ".venv"

[[tool.pyright.executionEnvironments]]
root = "examples"
reportUnknownVariableType = false

# huggingface_hub expõe Unknown nos overloads de download (tqdm genérico).
[[tool.pyright.executionEnvironments]]
root = "src/mlx_omnia/server"
reportUnknownVariableType = false

# transformers/huggingface_hub (dev-deps de fixture) expõem Unknown; só nos testes.
[[tool.pyright.executionEnvironments]]
root = "tests/server"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportPrivateUsage = false

[[tool.pyright.executionEnvironments]]
root = "tests"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportPrivateUsage = false

[tool.pytest.ini_options]
testpaths = ["tests"]
